name: Scrape latest data

# No schedule: the Amber Electric account behind AMBER_API_KEY is closed, so an
# unattended run would only ever record failures.
on:
  workflow_dispatch:

env:
  NIX_CONFIG: "accept-flake-config = true"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: native
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch latest data
        env:
          AMBER_SITE_ID: ${{ secrets.AMBER_SITE_ID }}
          AMBER_API_KEY: ${{ secrets.AMBER_API_KEY }}
        run: ./run.sh fetch

      - name: Commit and push if it changed
        run: |-
          git config user.name "Automated"
          git config user.email "actions@jamesst.one"
          git add events.json
          git commit -m "Latest data: $(date -u)" || exit 0
          git push origin HEAD:main
